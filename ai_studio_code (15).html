function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioDest = audioCtx.createMediaStreamDestination();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'sine', gainVal = 0.08) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (audioDest) gain.connect(audioDest);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playChime(notes = [523.25, 659.25, 783.99]) {
    notes.forEach((n, idx) => {
        setTimeout(() => playTone(n, 0.25, 'triangle', 0.07), idx * 90);
    });
}

const confettiPieces = Array.from({ length: 95 }, (_, i) => ({
    angle: (i / 95) * Math.PI * 2 + (Math.random() * 0.25),
    speed: 240 + Math.random() * 540,
    size: 8 + Math.random() * 10,

    rotSpeed: (Math.random() - 0.5) * 10
}));

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);

function roundRect(x, y, w, h, r, fill, stroke, lineW = 2) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineW; ctx.stroke(); }
}

function drawText(text, x, y, size, color, weight = '800', align = 'left', font = 'Inter') {
    ctx.font = `${weight} ${size}px "${font}", sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
}

function drawCallout(x, y, w, h, title, desc, accent = '#1d4ed8') {
    roundRect(x, y, w, h, 16, '#ffffff', accent, 2.5);
    roundRect(x, y, 8, h, 4, accent, null);
    drawText(title, x + 24, y + 26, 15, accent, '800', 'left');
    drawText(desc, x + 24, y + 54, 15, '#334155', '600', 'left');
}

function drawCursor(x, y, clicking = false) {
    ctx.save();
    ctx.translate(x, y);
    if (clicking) {
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.9)';
        ctx.lineWidth = 4;
        ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 32);
    ctx.lineTo(9, 24);
    ctx.lineTo(17, 38);
    ctx.lineTo(23, 35);
    ctx.lineTo(15, 21);
    ctx.lineTo(26, 20);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#0f2b6d';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
}

function drawBackground(t) {
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#e8f1ff');
    grad.addColorStop(0.5, '#ffffff');
    grad.addColorStop(1, '#fff8e1');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(29, 78, 216, 0.045)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    for (let i = 0; i < 10; i++) {
        const bx = ((i * 220 + t * (10 + (i % 3) * 6)) % (W + 200)) - 100;
        const by = 140 + ((i * 149) % 780) + Math.sin(t + i) * 18;
        const r = 34 + (i % 3) * 20;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 === 0 ? 'rgba(29, 78, 216, 0.05)' : 'rgba(245, 158, 11, 0.07)';
        ctx.fill();
    }
}

// =========================================================
// RENDER LOOP & CONTROLS
// =========================================================
function renderFrame(t) {
    drawBackground(t);
    if (t < 18) drawScene1(t);
    else if (t < 42) drawScene2(t);
    else if (t < 64) drawScene3(t);
    else if (t < 84) drawScene4(t);
    else drawScene5(t);

    drawSubtitles(t);
    updateUI(t);
}

function updateUI(t) {
    const mins = String(Math.floor(t / 60)).padStart(2, '0');
    const secs = String(Math.floor(t % 60)).padStart(2, '0');
    document.getElementById('timeLabel').innerText = `${mins}:${secs} / 01:45`;
    document.getElementById('scrubber').value = t;

    const pills = document.querySelectorAll('.scene-pill');
    const activeIdx = t < 18 ? 0 : t < 42 ? 1 : t < 64 ? 2 : t < 84 ? 3 : 4;
    pills.forEach((p, i) => p.classList.toggle('active', i === activeIdx));

    const sec = Math.floor(t);
    if (isPlaying && sec !== lastSecondMark) {
        lastSecondMark = sec;
        if ([0, 18, 42, 64, 84].includes(sec)) playChime();
        if (sec === 78) playChime([523.25, 659.25, 783.99, 1046.5]); // Sold fanfare!
    }

    if (isPlaying && voiceEnabled && activeIdx !== lastSpokenScene) {
        lastSpokenScene = activeIdx;
        speakScene(activeIdx);
    }
}

function speakScene(idx) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(SCENE_SCRIPTS[idx].text);
    u.rate = 1.03;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
}

function loop(now) {
    if (!isPlaying) return;
    if (lastFrameTime === null) lastFrameTime = now;
    const dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    currentTime += dt;
    if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        renderFrame(currentTime);
        stopPlaying();
        if (isRecording) finishExport();
        return;
    }

    renderFrame(currentTime);
    requestAnimationFrame(loop);
}

function togglePlay() {
    initAudio();
    if (isPlaying) stopPlaying();
    else startPlaying();
}

function startPlaying() {
    isPlaying = true;
    lastFrameTime = null;
    if (currentTime >= TOTAL_DURATION) currentTime = 0;
    document.getElementById('playBtn').innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
    requestAnimationFrame(loop);
}

function stopPlaying() {
    isPlaying = false;
    lastFrameTime = null;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    document.getElementById('playBtn').innerHTML = '<i class="fa-solid fa-play"></i> Play';
}

function restartVideo() {
    initAudio();
    currentTime = 0;
    lastSpokenScene = -1;
    lastSecondMark = -1;
    startPlaying();
}

function jumpTo(sec) {
    initAudio();
    currentTime = sec;
    lastSpokenScene = -1;
    lastSecondMark = -1;
    renderFrame(currentTime);
    if (isPlaying && voiceEnabled) {
        const idx = sec < 18 ? 0 : sec < 42 ? 1 : sec < 64 ? 2 : sec < 84 ? 3 : 4;
        lastSpokenScene = idx;
        speakScene(idx);
    }
}

function seekVideo(val) {
    currentTime = parseFloat(val);
    lastSpokenScene = -1;
    renderFrame(currentTime);
}

function toggleVoiceover() {
    voiceEnabled = !voiceEnabled;
    const btn = document.getElementById('voiceBtn');
    btn.classList.toggle('active', voiceEnabled);
    btn.innerHTML = voiceEnabled
        ? '<i class="fa-solid fa-microphone"></i> Voiceover: ON'
        : '<i class="fa-solid fa-microphone-slash"></i> Voiceover: OFF';
    if (!voiceEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
    else if (isPlaying) {
        lastSpokenScene = -1;
        updateUI(currentTime);
    }
}

function toggleExportVideo() {
    if (isRecording) {
        finishExport();
        return;
    }
    initAudio();
    const canvasStream = canvas.captureStream(60);
    const combinedTracks = [
        ...canvasStream.getVideoTracks(),
        ...(audioDest ? audioDest.stream.getAudioTracks() : [])
    ];
    const combinedStream = new MediaStream(combinedTracks);

    const mimeTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const chosenType = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: chosenType, videoBitsPerSecond: 6000000 });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Nexus_Legends_Captain_Master_Guide.webm';
        a.click();
        URL.revokeObjectURL(url);
    };

    isRecording = true;
    const expBtn = document.getElementById('exportBtn');
    expBtn.classList.add('btn-recording');
    expBtn.innerHTML = '<i class="fa-solid fa-stop"></i> Recording... (Click to Stop)';

    mediaRecorder.start(250);
    restartVideo();
}

function finishExport() {
    isRecording = false;
    stopPlaying();
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    const expBtn = document.getElementById('exportBtn');
    expBtn.classList.remove('btn-recording');
    expBtn.innerHTML = '<i class="fa-solid fa-download"></i> Export Video (.webm)';
}

renderFrame(0);
</script>
